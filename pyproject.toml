[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-guardian"
version = "0.1.0"
description = "Read-only Linux battery monitoring with honest charging-control discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Battery Guardian contributors" }]
dependencies = []

[project.optional-dependencies]
service = ["dbus-next>=0.2.3,<0.3"]
test = ["pytest>=7"]

[project.scripts]
battery-guardian-service = "battery_guardian.service:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
